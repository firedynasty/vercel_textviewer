<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link id="hljsThemeDark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <link id="hljsThemeLight" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" disabled>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top row: sidebar + panes */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid #0f3460;
            background: #0f3460;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .sidebar-header-btns { display: flex; gap: 4px; align-items: center; }

        .sidebar-hdr-btn {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            color: #94a3b8;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.15s;
            line-height: 1;
        }
        .sidebar-hdr-btn:hover { color: #eee; }
        .sidebar-hdr-btn.active { background: #e94560; color: white; border-color: #e94560; }

        .yt-toggle-btn, .audio-stop-btn {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            color: #94a3b8;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            font-family: inherit;
            transition: all 0.15s;
        }
        .yt-toggle-btn { display: none; }
        .audio-stop-btn { display: none; }
        .yt-toggle-btn:hover, .yt-toggle-btn.active { background: #e94560; color: white; border-color: #e94560; }
        .audio-stop-btn:hover { background: #e94560; color: white; border-color: #e94560; }

        .sidebar-list { flex: 1; overflow-y: auto; padding: 6px 0; }

        .sidebar-item {
            padding: 7px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover { background: #1a1a2e; }
        .sidebar-item.selected { background: #0f3460; border-left-color: #e94560; }
        .sidebar-item.playing { background: #1a3a1a; border-left-color: #4ade80; }
        .sidebar-item.selected.playing { background: #1a3a1a; }

        .type-badge {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: 700;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .type-badge.markdown { background: #3b82f6; color: white; }
        .type-badge.text     { background: #6b7280; color: white; }
        .type-badge.audio    { background: #10b981; color: white; }
        .type-badge.video    { background: #8b5cf6; color: white; }
        .type-badge.image    { background: #f59e0b; color: white; }
        .type-badge.docx     { background: #2563eb; color: white; }

        .item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        /* ===== MAIN WRAPPER (right of sidebar) ===== */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== TWO PANES ===== */
        .panes-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left pane: images + videos */
        .pane-left {
            flex: 3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 60px;
            background: #12122a;
        }

        /* Draggable divider */
        .pane-divider {
            width: 6px;
            background: #0f3460;
            flex-shrink: 0;
            cursor: col-resize;
            user-select: none;
            transition: background 0.15s;
            position: relative;
        }
        .pane-divider::after {
            content: '⋮';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #334155;
            font-size: 16px;
            pointer-events: none;
        }
        .pane-divider:hover, .pane-divider.dragging { background: #e94560; }
        .pane-divider:hover::after, .pane-divider.dragging::after { color: rgba(255,255,255,0.5); }

        /* Right pane: text/markdown */
        .pane-right {
            flex: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid #0f3460;
            min-width: 60px;
        }

        /* Pane headers */
        .pane-header {
            padding: 7px 12px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .pane-title {
            flex: 1;
            font-size: 12px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #94a3b8;
        }

        .header-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

        .header-btn {
            background: #0f3460;
            border: 1px solid #1a1a2e;
            color: #94a3b8;
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.15s;
        }
        .header-btn:hover { background: #1a1a2e; color: #eee; }

        .syntax-highlight-btn {
            padding: 2px 7px;
            background: rgba(230, 126, 34, 0.85);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 10px;
            font-weight: 700;
            font-family: inherit;
            display: none;
        }
        .syntax-highlight-btn:hover { background: rgba(211, 84, 0, 1); }
        .syntax-highlight-btn.active { background: rgba(46, 204, 113, 0.9); }

        .font-size-display {
            font-size: 10px;
            color: #64748b;
            min-width: 20px;
            text-align: center;
        }

        /* Scrollable pane content */
        .pane-content {
            flex: 1;
            overflow-y: auto;
        }

        /* Left pane content: center media */
        #paneLeftContent {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px;
            gap: 0;
        }

        /* Media display */
        .media-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .media-container img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .media-container video {
            max-width: 100%;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .media-filename {
            margin-top: 8px;
            font-size: 10px;
            color: #475569;
            text-align: center;
            font-family: monospace;
        }

        /* Floating nav buttons in left pane */
        .pane-left { position: relative; }
        .pane-nav-btns {
            position: absolute;
            bottom: 14px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 10;
        }
        .pane-nav-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.08);
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            opacity: 0.7;
        }
        .pane-nav-btn:hover { opacity: 1; transform: scale(1.1); }
        .pane-nav-btn.btn-media {
            background: rgba(245, 158, 11, 0.18);
            color: #f59e0b;
        }
        .pane-nav-btn.btn-media:hover { background: #f59e0b; color: white; border-color: #f59e0b; }
        .pane-nav-btn.btn-p2 {
            background: rgba(59, 130, 246, 0.18);
            color: #60a5fa;
        }
        .pane-nav-btn.btn-p2:hover { background: #3b82f6; color: white; border-color: #3b82f6; }
        .pane-nav-btn.btn-txt {
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            width: auto;
            border-radius: 18px;
            padding: 0 10px;
            font-size: 11px;
            font-weight: 700;
        }
        .pane-nav-btn.btn-txt:hover { background: #10b981; color: white; border-color: #10b981; }
        body.light-mode .pane-nav-btn.btn-media { background: rgba(245,158,11,0.15); }
        body.light-mode .pane-nav-btn.btn-p2   { background: rgba(59,130,246,0.15); }
        body.light-mode .pane-nav-btn.btn-txt  { background: rgba(16,185,129,0.15); }

        /* Nav prompt popup */
        .nav-prompt {
            position: absolute;
            bottom: 14px;
            right: 54px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 8px 10px;
            display: none;
            flex-direction: column;
            gap: 6px;
            z-index: 20;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .nav-prompt.visible { display: flex; }
        .nav-prompt-label { font-size: 10px; color: #64748b; }
        .nav-prompt-btns  { display: flex; gap: 5px; }
        .nav-prompt-btn {
            padding: 4px 9px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            font-family: inherit;
            transition: opacity 0.15s;
        }
        .nav-prompt-btn:hover { opacity: 0.85; }
        body.light-mode .nav-prompt { background: #f1f5f9; border-color: #cbd5e1; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        body.light-mode .nav-prompt-label { color: #94a3b8; }

        /* Right pane content body */
        .content-body {
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
            padding: 18px 22px;
            max-width: 860px;
        }

        /* Markdown styles */
        .content-body h1 { font-size: 1.9em; margin: 0.6em 0; border-bottom: 1px solid #333; padding-bottom: 0.3em; }
        .content-body h2 { font-size: 1.45em; margin: 0.8em 0; border-bottom: 1px solid #333; padding-bottom: 0.3em; }
        .content-body h3 { font-size: 1.2em; margin: 0.9em 0; }
        .content-body h4 { font-size: 1em; margin: 1.2em 0; }
        .content-body p  { margin: 0.9em 0; }
        .content-body ul, .content-body ol { margin: 0.9em 0; padding-left: 2em; }
        .content-body li { margin: 0.4em 0; }
        .content-body blockquote {
            border-left: 4px solid #e94560;
            margin: 1em 0; padding: 0.5em 1em;
            background: #16213e; color: #94a3b8;
        }
        .content-body code {
            background: #16213e; padding: 2px 6px; border-radius: 4px;
            font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.88em;
        }
        .content-body pre {
            background: #0d1117; padding: 14px; border-radius: 8px;
            overflow-x: auto; margin: 1em 0;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .content-body pre code { background: none; padding: 0; white-space: pre-wrap; word-wrap: break-word; }
        .content-body.no-highlight pre code { color: #e6e6e6 !important; }
        .content-body.no-highlight pre code * { color: inherit !important; }
        .content-body table { border-collapse: collapse; margin: 1em 0; width: 100%; }
        .content-body th, .content-body td { border: 1px solid #333; padding: 7px 11px; text-align: left; }
        .content-body th { background: #16213e; }
        .content-body a { color: #60a5fa; }
        .content-body img { max-width: 100%; }
        .content-body hr { border: none; border-top: 1px solid #333; margin: 2em 0; }
        .content-body.plain-text {
            white-space: pre-wrap;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 13px;
            padding: 18px 22px;
        }

        /* Welcome placeholders */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            color: #334155;
            text-align: center;
            padding: 30px 20px;
            width: 100%;
        }
        .welcome h2 { font-size: 15px; margin-bottom: 8px; color: #475569; }
        .welcome p  { font-size: 12px; max-width: 220px; }

        /* ===== AUDIO PLAYER ===== */
        .audio-player {
            padding: 9px 18px;
            background: #0f3460;
            border-top: 1px solid #16213e;
            display: none;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .audio-player.active { display: flex; }
        .now-playing { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .now-playing-icon { color: #4ade80; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .now-playing-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .audio-controls { display: flex; align-items: center; gap: 10px; }
        .audio-player button {
            background: #e94560; border: none; color: white;
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .audio-player button:hover { background: #ff6b6b; }
        .audio-time { font-size: 11px; color: #94a3b8; font-family: monospace; }
        .progress-bar {
            flex: 1; height: 4px; background: #1a1a2e;
            border-radius: 2px; cursor: pointer; max-width: 160px;
        }
        .progress-bar .progress { height: 100%; background: #e94560; border-radius: 2px; width: 0%; transition: width 0.1s; }

        /* ===== YOUTUBE VIEW ===== */
        .youtube-view { padding: 18px 22px; max-width: 900px; }
        .yt-player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 8px; overflow: hidden; }
        .yt-player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .yt-video-title { margin-top: 10px; font-size: 13px; color: #94a3b8; }
        .yt-times { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .yt-time-btn { padding: 3px 9px; border: none; border-radius: 10px; cursor: pointer; font-size: 11px; font-weight: 700; font-family: monospace; color: white; transition: opacity 0.15s; }
        .yt-time-btn:hover { opacity: 0.8; }
        .yt-links-list { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
        .yt-link-card { padding: 9px 13px; background: #16213e; border: 1px solid #0f3460; border-radius: 7px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
        .yt-link-card:hover, .yt-link-card.active { background: #0f3460; border-color: #e94560; }
        .yt-link-card.yt-selected { outline: 2px solid #60a5fa; outline-offset: -2px; }
        .yt-link-hint   { font-size: 13px; color: #eee; margin-bottom: 3px; }
        .yt-link-source { font-size: 10px; color: #64748b; margin-bottom: 5px; }
        .yt-link-times  { display: flex; flex-wrap: wrap; gap: 4px; }

        /* ===== LIGHT MODE ===== */
        body.light-mode { background: #f5f7fa; color: #1e293b; }
        body.light-mode .sidebar { background: #e8ecf1; border-right-color: #cbd5e1; }
        body.light-mode .sidebar-header { background: #cbd5e1; border-bottom-color: #cbd5e1; }
        body.light-mode .sidebar-header h2 { color: #475569; }
        body.light-mode .sidebar-hdr-btn { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
        body.light-mode .sidebar-hdr-btn:hover { background: #fff; color: #1e293b; }
        body.light-mode .sidebar-hdr-btn.active { background: #e94560; color: white; border-color: #e94560; }
        body.light-mode .yt-toggle-btn, body.light-mode .audio-stop-btn { background: #f1f5f9; border-color: #cbd5e1; color: #475569; }
        body.light-mode .yt-toggle-btn:hover, body.light-mode .yt-toggle-btn.active,
        body.light-mode .audio-stop-btn:hover { background: #e94560; color: white; border-color: #e94560; }
        body.light-mode .sidebar-item:hover { background: #f1f5f9; }
        body.light-mode .sidebar-item.selected { background: #dbeafe; border-left-color: #3b82f6; }
        body.light-mode .sidebar-item.playing { background: #dcfce7; border-left-color: #22c55e; }
        body.light-mode .item-title { color: #1e293b; }
        body.light-mode .pane-left { background: #eef2f7; }
        body.light-mode .pane-right { border-left-color: #cbd5e1; }
        body.light-mode .pane-header { background: #e8ecf1; border-bottom-color: #cbd5e1; }
        body.light-mode .pane-title { color: #475569; }
        body.light-mode .pane-divider { background: #cbd5e1; }
        body.light-mode .pane-divider::after { color: #94a3b8; }
        body.light-mode .pane-divider:hover, body.light-mode .pane-divider.dragging { background: #e94560; }
        body.light-mode .header-btn { background: #cbd5e1; border-color: #e2e8f0; color: #475569; }
        body.light-mode .header-btn:hover { background: #f1f5f9; color: #1e293b; }
        body.light-mode .content-body { color: #1e293b; }
        body.light-mode .content-body h1, body.light-mode .content-body h2 { border-bottom-color: #cbd5e1; }
        body.light-mode .content-body blockquote { background: #f1f5f9; color: #64748b; }
        body.light-mode .content-body code { background: #e2e8f0; color: #1e293b; }
        body.light-mode .content-body pre { background: #f1f5f9; }
        body.light-mode .content-body pre code { background: none; }
        body.light-mode .content-body th, body.light-mode .content-body td { border-color: #cbd5e1; }
        body.light-mode .content-body th { background: #e8ecf1; }
        body.light-mode .content-body a { color: #2563eb; }
        body.light-mode .content-body hr { border-top-color: #cbd5e1; }
        body.light-mode .content-body.plain-text { color: #1e293b; }
        body.light-mode .audio-player { background: #e2e8f0; border-top-color: #cbd5e1; }
        body.light-mode .now-playing-title { color: #1e293b; }
        body.light-mode .audio-time { color: #475569; }
        body.light-mode .progress-bar { background: #cbd5e1; }
        body.light-mode .welcome { color: #94a3b8; }
        body.light-mode .welcome h2 { color: #64748b; }
        body.light-mode .yt-link-card { background: #f1f5f9; border-color: #cbd5e1; }
        body.light-mode .yt-link-card:hover, body.light-mode .yt-link-card.active { background: #dbeafe; border-color: #3b82f6; }
        body.light-mode .yt-link-hint { color: #1e293b; }
        body.light-mode .yt-link-source { color: #64748b; }
        body.light-mode .media-filename { color: #94a3b8; }

        /* Mobile: stack panes vertically */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 28vh; border-right: none; border-bottom: 1px solid #0f3460; }
            body.light-mode .sidebar { border-bottom-color: #cbd5e1; }
            .panes-wrapper { flex-direction: column; }
            .pane-left { flex: none; height: 40vh; min-width: unset; }
            .pane-divider { width: 100%; height: 6px; cursor: row-resize; }
            .pane-divider::after { content: '···'; }
            .pane-right { flex: 1; min-width: unset; border-left: none; border-top: 1px solid #0f3460; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Content Files</h2>
                <div class="sidebar-header-btns">
                    <button class="sidebar-hdr-btn" id="textOnlyBtn" title="Show only MD/TXT files">Aa</button>
                    <button class="sidebar-hdr-btn" id="themeToggleBtn" title="Toggle theme">&#9680;</button>
                    <button class="yt-toggle-btn" id="ytToggleBtn" title="YouTube links">YT</button>
                    <button class="audio-stop-btn" id="audioStopBtn" title="Stop audio">&#9632;</button>
                </div>
            </div>
            <div class="sidebar-list" id="sidebarList"></div>
        </nav>

        <!-- Main wrapper: panes + audio bar -->
        <div class="main-wrapper">

            <div class="panes-wrapper" id="panesWrapper">

                <!-- LEFT PANE: images + videos -->
                <div class="pane-left" id="paneLeft">
                    <div class="pane-header">
                        <span class="type-badge image" id="paneLeftBadge">IMG</span>
                        <span class="pane-title" id="paneLeftTitle">Media</span>
                    </div>
                    <div class="pane-content" id="paneLeftContent">
                        <div class="welcome">
                            <h2>Media</h2>
                            <p>Select an image or video from the sidebar.</p>
                        </div>
                    </div>
                    <!-- Floating nav buttons -->
                    <div class="pane-nav-btns">
                        <!-- Prompt shown when next item after selection is a TXT -->
                        <div class="nav-prompt" id="navPrompt">
                            <div class="nav-prompt-label">Next is a TXT file</div>
                            <div class="nav-prompt-btns">
                                <button class="nav-prompt-btn" id="promptLoadTxt" style="background:#10b981;color:white">▼ TXT</button>
                                <button class="nav-prompt-btn" id="promptSkipImg" style="background:#f59e0b;color:white">→ IMG</button>
                                <button class="nav-prompt-btn" id="promptDismiss" style="background:#334155;color:#94a3b8">✕</button>
                            </div>
                        </div>
                        <button class="pane-nav-btn btn-media" id="nextMediaBtn" title="Next image/video">▼</button>
                        <button class="pane-nav-btn btn-p2"    id="pane2DownBtn" title="Page down text pane">≡↓</button>
                        <button class="pane-nav-btn btn-txt"   id="prevTextBtn"  title="Previous text/markdown file">▲ TXT</button>
                        <button class="pane-nav-btn btn-txt"   id="nextTextBtn"  title="Next text/markdown file">▼ TXT</button>
                    </div>
                </div>

                <!-- DIVIDER -->
                <div class="pane-divider" id="paneDivider" title="Drag to resize · Double-click to reset"></div>

                <!-- RIGHT PANE: text + markdown -->
                <div class="pane-right" id="paneRight">
                    <div class="pane-header">
                        <span class="type-badge text" id="paneRightBadge">TXT</span>
                        <span class="pane-title" id="paneRightTitle">Text</span>
                        <div class="header-controls">
                            <button class="syntax-highlight-btn" id="syntaxHighlightBtn" title="Syntax highlight">{ }</button>
                            <button class="header-btn" id="fontDecreaseBtn" title="Smaller text">-</button>
                            <span class="font-size-display" id="fontSizeDisplay">16</span>
                            <button class="header-btn" id="fontIncreaseBtn" title="Larger text">+</button>
                        </div>
                    </div>
                    <div class="pane-content" id="paneRightContent">
                        <div class="content-body" id="contentBody">
                            <div class="welcome">
                                <h2>Text</h2>
                                <p>Select a text or markdown file from the sidebar.</p>
                            </div>
                        </div>
                        <div class="youtube-view" id="youtubeView" style="display:none">
                            <div class="yt-player-wrapper">
                                <div id="ytPlayerContainer"></div>
                            </div>
                            <div class="yt-video-title" id="ytVideoTitle"></div>
                            <div class="yt-times" id="ytTimes"></div>
                            <div class="yt-links-list" id="ytLinksList"></div>
                        </div>
                    </div>
                </div>

            </div><!-- end panes-wrapper -->

            <!-- Audio player spans both panes -->
            <div class="audio-player" id="audioPlayer">
                <div class="now-playing">
                    <span class="now-playing-icon">&#9835;</span>
                    <span class="now-playing-title" id="nowPlayingTitle"></span>
                </div>
                <div class="audio-controls">
                    <span class="audio-time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span class="audio-time" id="duration">0:00</span>
                    <button id="playPauseBtn" title="Play/Pause">&#9658;</button>
                    <button id="stopBtn" title="Stop">&#9632;</button>
                </div>
            </div>

        </div><!-- end main-wrapper -->
    </div><!-- end container -->

    <audio id="audioElement"></audio>

    <script src="content_data.js"></script>
    <script>
        // ===== STATE =====
        let selectedIndex = -1;
        let playingIndex = -1;
        let leftDisplayedIndex = -1;
        let rightDisplayedIndex = -1;
        let fontSize = 16;
        let syntaxHighlightEnabled = false;
        let lightMode = false;
        let textOnlyFilter = false;
        let youtubeViewActive = false;
        let ytPlayer = null;
        let ytPlayerReady = false;
        let ytCurrentVideoId = null;
        let ytSelectedLinkIndex = -1;
        const MIN_FONT = 12, MAX_FONT = 30;
        const TIME_COLORS = ['#e94560','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316'];

        // ===== ELEMENTS =====
        const sidebarList       = document.getElementById('sidebarList');
        const paneLeftBadge     = document.getElementById('paneLeftBadge');
        const paneLeftTitle     = document.getElementById('paneLeftTitle');
        const paneLeftContent   = document.getElementById('paneLeftContent');
        const paneRightBadge    = document.getElementById('paneRightBadge');
        const paneRightTitle    = document.getElementById('paneRightTitle');
        const paneRightContent  = document.getElementById('paneRightContent');
        const contentBody       = document.getElementById('contentBody');
        const audioPlayer       = document.getElementById('audioPlayer');
        const audioElement      = document.getElementById('audioElement');
        const nowPlayingTitle   = document.getElementById('nowPlayingTitle');
        const playPauseBtn      = document.getElementById('playPauseBtn');
        const stopBtn           = document.getElementById('stopBtn');
        const progressBar       = document.getElementById('progressBar');
        const progress          = document.getElementById('progress');
        const currentTimeEl     = document.getElementById('currentTime');
        const durationEl        = document.getElementById('duration');
        const fontDecreaseBtn   = document.getElementById('fontDecreaseBtn');
        const fontIncreaseBtn   = document.getElementById('fontIncreaseBtn');
        const fontSizeDisplay   = document.getElementById('fontSizeDisplay');
        const syntaxHighlightBtn= document.getElementById('syntaxHighlightBtn');
        const textOnlyBtn       = document.getElementById('textOnlyBtn');
        const themeToggleBtn    = document.getElementById('themeToggleBtn');
        const hljsThemeDark     = document.getElementById('hljsThemeDark');
        const hljsThemeLight    = document.getElementById('hljsThemeLight');
        const ytToggleBtn       = document.getElementById('ytToggleBtn');
        const audioStopBtn      = document.getElementById('audioStopBtn');
        const youtubeView       = document.getElementById('youtubeView');
        const ytVideoTitle      = document.getElementById('ytVideoTitle');
        const ytTimesEl         = document.getElementById('ytTimes');
        const ytLinksList       = document.getElementById('ytLinksList');

        // ===== MARKED CONFIG =====
        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            const t = title ? ` title="${title}"` : '';
            return `<a href="${href}"${t} target="_blank" rel="noopener noreferrer">${text}</a>`;
        };
        marked.setOptions({ breaks: true, gfm: true, renderer });

        // ===== HELPERS =====
        function badgeText(type) {
            return { markdown:'MD', text:'TXT', audio:'♪', video:'▶', image:'IMG', docx:'DOC' }[type] || type.toUpperCase();
        }

        // ===== SIDEBAR =====
        function initSidebar() {
            if (typeof contentData === 'undefined' || !contentData.files) {
                sidebarList.innerHTML = '<div style="padding:14px;color:#e94560;font-size:12px;">content_data.js not found.<br>Run: python process_content.py</div>';
                return;
            }
            contentData.files.forEach((file, i) => {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.dataset.index = i;

                const badge = document.createElement('span');
                badge.className = `type-badge ${file.type}`;
                badge.textContent = badgeText(file.type);

                const title = document.createElement('span');
                title.className = 'item-title';
                title.textContent = file.title;
                title.title = file.title;

                item.appendChild(badge);
                item.appendChild(title);
                item.addEventListener('click', () => handleItemClick(i));
                sidebarList.appendChild(item);
            });
        }

        // ===== ROUTING: click goes to correct pane =====
        function handleItemClick(index) {
            const file = contentData.files[index];
            if (file.type === 'audio') {
                playAudio(index);
            } else if (file.type === 'image' || file.type === 'video') {
                displayMedia(index);
            } else {
                // text, markdown, docx (docx is converted to markdown)
                exitYouTubeView();
                displayText(index);
            }
            selectItem(index);
        }

        function selectItem(index) {
            selectedIndex = index;
            updateSidebarStyles();
        }

        function updateSidebarStyles() {
            sidebarList.querySelectorAll('.sidebar-item').forEach((item, i) => {
                item.classList.toggle('selected', i === selectedIndex);
                item.classList.toggle('playing', i === playingIndex);
            });
        }

        // ===== LEFT PANE: media =====
        function displayMedia(index) {
            const file = contentData.files[index];
            leftDisplayedIndex = index;

            paneLeftBadge.className = `type-badge ${file.type}`;
            paneLeftBadge.textContent = badgeText(file.type);
            paneLeftTitle.textContent = file.title;

            if (file.type === 'image') {
                paneLeftContent.innerHTML = `
                    <div class="media-container">
                        <img src="${file.path}" alt="${file.title}">
                        <div class="media-filename">${file.filename}</div>
                    </div>`;
            } else if (file.type === 'video') {
                paneLeftContent.innerHTML = `
                    <div class="media-container">
                        <video controls>
                            <source src="${file.path}" type="video/mp4">
                            Your browser does not support video.
                        </video>
                        <div class="media-filename">${file.filename}</div>
                    </div>`;
            }
            paneLeftContent.scrollTop = 0;
        }

        // ===== RIGHT PANE: text/markdown =====
        function displayText(index) {
            const file = contentData.files[index];
            rightDisplayedIndex = index;

            paneRightBadge.className = `type-badge ${file.type}`;
            paneRightBadge.textContent = badgeText(file.type);
            paneRightTitle.textContent = file.title;

            syntaxHighlightBtn.style.display = file.type === 'markdown' ? 'inline-block' : 'none';

            if (file.type === 'markdown') {
                contentBody.className = 'content-body';
                if (!syntaxHighlightEnabled) contentBody.classList.add('no-highlight');
                contentBody.innerHTML = marked.parse(file.content || '');
                if (syntaxHighlightEnabled) {
                    contentBody.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
                }
            } else {
                contentBody.className = 'content-body plain-text';
                contentBody.textContent = file.content || '';
            }

            contentBody.style.fontSize = fontSize + 'px';
            contentBody.style.display = '';
            youtubeView.style.display = 'none';
            paneRightContent.scrollTop = 0;
        }

        // ===== AUDIO =====
        function playAudio(index) {
            const file = contentData.files[index];
            if (playingIndex === index) {
                audioElement.paused ? audioElement.play() : audioElement.pause();
                return;
            }
            playingIndex = index;
            audioElement.src = file.path;
            audioElement.play();
            nowPlayingTitle.textContent = file.title;
            audioPlayer.classList.add('active');
            audioStopBtn.style.display = 'inline-block';
            updateSidebarStyles();
        }

        function stopAudio() {
            audioElement.pause();
            audioElement.currentTime = 0;
            playingIndex = -1;
            audioPlayer.classList.remove('active');
            audioStopBtn.style.display = 'none';
            updateSidebarStyles();
        }

        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
        }

        audioElement.addEventListener('timeupdate', () => {
            progress.style.width = `${(audioElement.currentTime / audioElement.duration) * 100}%`;
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
        });
        audioElement.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audioElement.duration); });
        audioElement.addEventListener('play',   () => { playPauseBtn.innerHTML = '&#10074;&#10074;'; });
        audioElement.addEventListener('pause',  () => { playPauseBtn.innerHTML = '&#9658;'; });
        audioElement.addEventListener('ended',  () => { playPauseBtn.innerHTML = '&#9658;'; progress.style.width = '0%'; });

        playPauseBtn.addEventListener('click', () => audioElement.paused ? audioElement.play() : audioElement.pause());
        stopBtn.addEventListener('click', stopAudio);
        audioStopBtn.addEventListener('click', stopAudio);
        progressBar.addEventListener('click', (e) => {
            const r = progressBar.getBoundingClientRect();
            audioElement.currentTime = ((e.clientX - r.left) / r.width) * audioElement.duration;
        });

        // ===== FONT SIZE =====
        function updateFontSize(n) {
            fontSize = Math.max(MIN_FONT, Math.min(MAX_FONT, n));
            contentBody.style.fontSize = fontSize + 'px';
            fontSizeDisplay.textContent = fontSize;
            try { localStorage.setItem('viewer-font-size', fontSize); } catch(e) {}
        }
        fontDecreaseBtn.addEventListener('click', () => updateFontSize(fontSize - 2));
        fontIncreaseBtn.addEventListener('click', () => updateFontSize(fontSize + 2));

        // ===== SYNTAX HIGHLIGHT =====
        function toggleSyntaxHighlight() {
            syntaxHighlightEnabled = !syntaxHighlightEnabled;
            syntaxHighlightBtn.classList.toggle('active', syntaxHighlightEnabled);
            syntaxHighlightBtn.textContent = syntaxHighlightEnabled ? '🎨' : '{ }';
            contentBody.classList.toggle('no-highlight', !syntaxHighlightEnabled);
            if (syntaxHighlightEnabled && rightDisplayedIndex >= 0 && contentData.files[rightDisplayedIndex].type === 'markdown') {
                contentBody.querySelectorAll('pre code').forEach(b => { b.removeAttribute('data-highlighted'); hljs.highlightElement(b); });
            }
            try { localStorage.setItem('viewer-syntax-highlight', syntaxHighlightEnabled); } catch(e) {}
        }
        syntaxHighlightBtn.addEventListener('click', toggleSyntaxHighlight);

        // ===== THEME =====
        function setTheme(isLight) {
            lightMode = isLight;
            document.body.classList.toggle('light-mode', isLight);
            hljsThemeDark.disabled = isLight;
            hljsThemeLight.disabled = !isLight;
            try { localStorage.setItem('viewer-light-mode', isLight); } catch(e) {}
        }
        themeToggleBtn.addEventListener('click', () => setTheme(!lightMode));

        // ===== TEXT-ONLY FILTER =====
        textOnlyBtn.addEventListener('click', () => {
            textOnlyFilter = !textOnlyFilter;
            sidebarList.querySelectorAll('.sidebar-item').forEach(item => {
                const f = contentData.files[parseInt(item.dataset.index, 10)];
                item.style.display = textOnlyFilter
                    ? (f.type === 'markdown' || f.type === 'text') ? '' : 'none'
                    : '';
            });
            textOnlyBtn.classList.toggle('active', textOnlyFilter);
        });

        // ===== LOAD PREFERENCES =====
        function loadPreferences() {
            try {
                const fs = localStorage.getItem('viewer-font-size');
                if (fs) { fontSize = parseInt(fs, 10); contentBody.style.fontSize = fontSize + 'px'; fontSizeDisplay.textContent = fontSize; }

                const sh = localStorage.getItem('viewer-syntax-highlight');
                if (sh !== null) {
                    syntaxHighlightEnabled = sh === 'true';
                    syntaxHighlightBtn.classList.toggle('active', syntaxHighlightEnabled);
                    syntaxHighlightBtn.textContent = syntaxHighlightEnabled ? '🎨' : '{ }';
                    contentBody.classList.toggle('no-highlight', !syntaxHighlightEnabled);
                }
                if (localStorage.getItem('viewer-light-mode') === 'true') setTheme(true);
            } catch(e) {}
        }

        // ===== YOUTUBE =====
        function initYouTubeButton() {
            if ((contentData.youtube_links || []).length > 0) ytToggleBtn.style.display = 'inline-block';
        }

        function toggleYouTubeView() {
            youtubeViewActive = !youtubeViewActive;
            ytToggleBtn.classList.toggle('active', youtubeViewActive);
            if (youtubeViewActive) {
                contentBody.style.display = 'none';
                youtubeView.style.display = 'block';
                renderYouTubeLinksList();
                ytSelectedLinkIndex = -1;
            } else {
                youtubeView.style.display = 'none';
                contentBody.style.display = '';
            }
        }

        function exitYouTubeView() {
            if (!youtubeViewActive) return;
            youtubeViewActive = false;
            ytToggleBtn.classList.remove('active');
            youtubeView.style.display = 'none';
            contentBody.style.display = '';
        }

        function renderYouTubeLinksList() {
            ytLinksList.innerHTML = '';
            (contentData.youtube_links || []).forEach((link, idx) => {
                const card = document.createElement('div');
                card.className = 'yt-link-card';
                card.dataset.index = idx;

                const hint = document.createElement('div');
                hint.className = 'yt-link-hint';
                hint.textContent = link.hint || link.url;
                card.appendChild(hint);

                const src = document.createElement('div');
                src.className = 'yt-link-source';
                src.textContent = link.source_file;
                card.appendChild(src);

                if (link.times && link.times.length > 0) {
                    const row = document.createElement('div');
                    row.className = 'yt-link-times';
                    link.times.forEach((t, ti) => {
                        const btn = document.createElement('button');
                        btn.className = 'yt-time-btn';
                        btn.textContent = t;
                        btn.style.background = TIME_COLORS[ti % TIME_COLORS.length];
                        btn.addEventListener('click', e => { e.stopPropagation(); loadYTVideo(link.video_id, idx); seekTo(t); });
                        row.appendChild(btn);
                    });
                    card.appendChild(row);
                }
                card.addEventListener('click', () => loadYTVideo(link.video_id, idx));
                ytLinksList.appendChild(card);
            });
            updateYtCards();
        }

        function updateYtCards() {
            ytLinksList.querySelectorAll('.yt-link-card').forEach((card, i) => {
                const link = contentData.youtube_links[i];
                card.classList.toggle('active', link && link.video_id === ytCurrentVideoId);
                card.classList.toggle('yt-selected', i === ytSelectedLinkIndex);
            });
        }

        function loadYTVideo(videoId, linkIndex) {
            ytCurrentVideoId = videoId;
            if (linkIndex !== undefined) ytSelectedLinkIndex = linkIndex;
            const link = contentData.youtube_links.find(l => l.video_id === videoId);
            ytVideoTitle.textContent = link ? (link.hint || link.url) : '';
            ytTimesEl.innerHTML = '';
            if (link && link.times && link.times.length > 0) {
                link.times.forEach((t, ti) => {
                    const btn = document.createElement('button');
                    btn.className = 'yt-time-btn';
                    btn.textContent = t;
                    btn.style.background = TIME_COLORS[ti % TIME_COLORS.length];
                    btn.addEventListener('click', () => seekTo(t));
                    ytTimesEl.appendChild(btn);
                });
            }
            ytPlayer && ytPlayerReady ? ytPlayer.loadVideoById(videoId) : initYTPlayer(videoId);
            updateYtCards();
        }

        function initYTPlayer(videoId) {
            if (!window.YT || !window.YT.Player) {
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                document.head.appendChild(tag);
                window.onYouTubeIframeAPIReady = () => createYTPlayer(videoId);
            } else {
                createYTPlayer(videoId);
            }
        }

        function createYTPlayer(videoId) {
            ytPlayer = new YT.Player('ytPlayerContainer', {
                videoId,
                playerVars: { enablejsapi:1, rel:0, modestbranding:1 },
                events: { onReady: () => { ytPlayerReady = true; } }
            });
        }

        function seekTo(timeStr) {
            const p = timeStr.split(':');
            const s = parseInt(p[0],10)*60 + parseInt(p[1],10);
            if (ytPlayer && ytPlayerReady) ytPlayer.seekTo(s, true);
        }

        ytToggleBtn.addEventListener('click', toggleYouTubeView);

        // ===== KEYBOARD =====
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const files = contentData.files || [];
            const ytLinks = (contentData && contentData.youtube_links) || [];

            if (youtubeViewActive && ytLinks.length > 0) {
                if (e.key === 'ArrowDown' || e.key === 'j') {
                    e.preventDefault();
                    if (ytSelectedLinkIndex < ytLinks.length - 1) { ytSelectedLinkIndex++; updateYtCards(); scrollYtSelected(); }
                } else if (e.key === 'ArrowUp' || e.key === 'k') {
                    e.preventDefault();
                    if (ytSelectedLinkIndex > 0) { ytSelectedLinkIndex--; updateYtCards(); scrollYtSelected(); }
                } else if (e.key === 'Enter' && ytSelectedLinkIndex >= 0) {
                    e.preventDefault(); loadYTVideo(ytLinks[ytSelectedLinkIndex].video_id, ytSelectedLinkIndex);
                } else if (e.key === 'Escape') {
                    e.preventDefault(); exitYouTubeView();
                }
                return;
            }

            if (e.key === 'ArrowDown' || e.key === 'j') {
                e.preventDefault();
                if (selectedIndex < files.length - 1) { selectItem(selectedIndex + 1); scrollSidebarSelected(); }
            } else if (e.key === 'ArrowUp' || e.key === 'k') {
                e.preventDefault();
                if (selectedIndex > 0) { selectItem(selectedIndex - 1); scrollSidebarSelected(); }
            } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
                e.preventDefault();
                if (selectedIndex >= 0) { handleItemClick(selectedIndex); scrollSidebarSelected(); }
            } else if (e.key === ' ') {
                if (playingIndex >= 0) {
                    e.preventDefault();
                    audioElement.paused ? audioElement.play() : audioElement.pause();
                } else if (selectedIndex >= 0 && files[selectedIndex].type === 'audio') {
                    e.preventDefault(); playAudio(selectedIndex);
                }
            } else if (e.key === 'Escape' && playingIndex >= 0) {
                stopAudio();
            }
        });

        function scrollYtSelected() {
            const cards = ytLinksList.querySelectorAll('.yt-link-card');
            if (cards[ytSelectedLinkIndex]) cards[ytSelectedLinkIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        function scrollSidebarSelected() {
            const items = sidebarList.querySelectorAll('.sidebar-item');
            if (items[selectedIndex]) items[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // ===== DRAG-TO-RESIZE DIVIDER =====
        (function() {
            const divider  = document.getElementById('paneDivider');
            const leftPane = document.getElementById('paneLeft');
            const rightPane= document.getElementById('paneRight');
            const wrapper  = document.getElementById('panesWrapper');

            // Restore saved ratio
            try {
                const saved = localStorage.getItem('paneSplitRatio');
                if (saved) {
                    const ratio = parseFloat(saved);
                    if (ratio > 0.1 && ratio < 0.9) {
                        leftPane.style.flex  = 'none';
                        rightPane.style.flex = 'none';
                        leftPane.style.width  = (ratio * 100) + '%';
                        rightPane.style.width = ((1 - ratio) * 100) + '%';
                    }
                }
            } catch(e) {}

            divider.addEventListener('mousedown', function(e) {
                e.preventDefault();
                divider.classList.add('dragging');
                const startX     = e.clientX;
                const containerW = wrapper.offsetWidth - divider.offsetWidth;
                const startLeftW = leftPane.offsetWidth;

                function onMove(e) {
                    const newLeft = Math.min(Math.max(startLeftW + (e.clientX - startX), containerW * 0.1), containerW * 0.9);
                    leftPane.style.flex  = 'none';
                    rightPane.style.flex = 'none';
                    leftPane.style.width  = newLeft + 'px';
                    rightPane.style.width = (containerW - newLeft) + 'px';
                }
                function onUp() {
                    divider.classList.remove('dragging');
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    try {
                        const ratio = leftPane.offsetWidth / (leftPane.offsetWidth + rightPane.offsetWidth);
                        localStorage.setItem('paneSplitRatio', ratio);
                    } catch(e) {}
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            // Double-click resets to default 3:5
            divider.addEventListener('dblclick', function() {
                leftPane.style.flex  = '3';
                leftPane.style.width = '';
                rightPane.style.flex = '5';
                rightPane.style.width= '';
                try { localStorage.removeItem('paneSplitRatio'); } catch(e) {}
            });
        })();

        // ===== PANE NAV BUTTONS =====
        // ===== NAV PROMPT (shown when next item is a TXT) =====
        let promptPendingIndex = -1;

        function showNavPrompt(txtIndex) {
            promptPendingIndex = txtIndex;
            document.getElementById('navPrompt').classList.add('visible');
        }
        function hideNavPrompt() {
            promptPendingIndex = -1;
            document.getElementById('navPrompt').classList.remove('visible');
        }

        function findNextMedia(fromIndex) {
            const files = contentData.files || [];
            for (let i = fromIndex; i < files.length; i++) {
                if (files[i].type === 'image' || files[i].type === 'video') return i;
            }
            for (let i = 0; i < fromIndex; i++) {
                if (files[i].type === 'image' || files[i].type === 'video') return i;
            }
            return -1;
        }

        // Button 1: next image/video — prompt if the very next item is a TXT
        document.getElementById('nextMediaBtn').addEventListener('click', function() {
            hideNavPrompt();
            const files = contentData.files || [];
            const next = selectedIndex >= 0 ? selectedIndex + 1 : 0;
            if (next < files.length && (files[next].type === 'text' || files[next].type === 'markdown')) {
                // Next item is a TXT — ask user
                showNavPrompt(next);
                return;
            }
            // Next is image/video (or audio/other): find and go
            const idx = findNextMedia(next < files.length ? next : 0);
            if (idx >= 0) { displayMedia(idx); selectItem(idx); scrollSidebarSelected(); }
        });

        // Prompt: load the TXT in right pane
        document.getElementById('promptLoadTxt').addEventListener('click', function() {
            if (promptPendingIndex >= 0) {
                const i = promptPendingIndex;
                hideNavPrompt();
                exitYouTubeView(); displayText(i); selectItem(i); scrollSidebarSelected();
            }
        });

        // Prompt: skip the TXT, jump to next image/video after it
        document.getElementById('promptSkipImg').addEventListener('click', function() {
            if (promptPendingIndex >= 0) {
                const skipFrom = promptPendingIndex + 1;
                hideNavPrompt();
                const idx = findNextMedia(skipFrom);
                if (idx >= 0) { displayMedia(idx); selectItem(idx); scrollSidebarSelected(); }
            }
        });

        // X button: dismiss without doing anything
        document.getElementById('promptDismiss').addEventListener('click', hideNavPrompt);

        // Clicking anywhere else dismisses the prompt
        document.addEventListener('click', function(e) {
            const prompt = document.getElementById('navPrompt');
            const btn = document.getElementById('nextMediaBtn');
            if (!prompt.contains(e.target) && e.target !== btn) hideNavPrompt();
        });

        // Button 2: page down the right (text) pane
        document.getElementById('pane2DownBtn').addEventListener('click', function() {
            paneRightContent.scrollBy({ top: paneRightContent.clientHeight * 0.85, behavior: 'smooth' });
        });

        // Button 3: previous text/markdown file
        document.getElementById('prevTextBtn').addEventListener('click', function() {
            const files = contentData.files || [];
            const start = selectedIndex >= 0 ? selectedIndex - 1 : files.length - 1;
            for (let i = start; i >= 0; i--) {
                if (files[i].type === 'text' || files[i].type === 'markdown') {
                    exitYouTubeView(); displayText(i); selectItem(i); scrollSidebarSelected(); return;
                }
            }
            // Wrap around
            for (let i = files.length - 1; i > start; i--) {
                if (files[i].type === 'text' || files[i].type === 'markdown') {
                    exitYouTubeView(); displayText(i); selectItem(i); scrollSidebarSelected(); return;
                }
            }
        });

        // Button 4: next text/markdown file
        document.getElementById('nextTextBtn').addEventListener('click', function() {
            const files = contentData.files || [];
            const start = selectedIndex >= 0 ? selectedIndex + 1 : 0;
            for (let i = start; i < files.length; i++) {
                if (files[i].type === 'text' || files[i].type === 'markdown') {
                    exitYouTubeView(); displayText(i); selectItem(i); scrollSidebarSelected(); return;
                }
            }
            // Wrap around
            for (let i = 0; i < start; i++) {
                if (files[i].type === 'text' || files[i].type === 'markdown') {
                    exitYouTubeView(); displayText(i); selectItem(i); scrollSidebarSelected(); return;
                }
            }
        });

        // ===== INIT =====
        loadPreferences();
        initSidebar();
        initYouTubeButton();

        if (contentData && contentData.files && contentData.files.length > 0) {
            // Auto-load first media into left pane, first text into right pane
            const firstMedia = contentData.files.findIndex(f => f.type === 'image' || f.type === 'video');
            const firstText  = contentData.files.findIndex(f => f.type === 'text' || f.type === 'markdown');
            if (firstMedia >= 0) displayMedia(firstMedia);
            if (firstText  >= 0) displayText(firstText);
            selectItem(0);
        }
    </script>
</body>
</html>
